name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Chuẩn bị thư mục site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          # Logo dùng chung với Alexios: lấy bản mới nhất mỗi lần triển khai
          curl -fsSL --retry 3 https://alex-workspace.pages.dev/alexios-logo.png -o _site/alexios-logo.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
